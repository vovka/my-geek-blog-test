<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">The complexity ceiling</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <!-- axes -->
  <line x1="120" y1="520" x2="1100" y2="520" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <line x1="120" y1="520" x2="120" y2="110" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <text x="620" y="570" text-anchor="middle" font-size="22" fill="#374151">Features generated with AI over time</text>
  <text x="60" y="320" text-anchor="middle" font-size="22" fill="#374151" transform="rotate(-90 60 320)">Amount</text>
  <!-- system complexity: grows super-linearly -->
  <path d="M120,500 C400,480 700,380 1050,140" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="640" y="150" font-size="22" font-weight="700" fill="#dc2626">System complexity</text>
  <text x="640" y="176" font-size="17" fill="#991b1b">behaviour, dependencies, state, integrations, past decisions</text>
  <!-- human understanding: flat line -->
  <path d="M120,440 C300,430 500,432 1050,436" fill="none" stroke="#2563eb" stroke-width="5"/>
  <text x="640" y="470" font-size="22" font-weight="700" fill="#2563eb">What the owner still understands</text>
  <!-- crossing point -->
  <circle cx="520" cy="432" r="10" fill="#111827"/>
  <line x1="520" y1="420" x2="520" y2="330" stroke="#111827" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="520" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">ceiling</text>
  <text x="420" y="200" text-anchor="middle" font-size="18" fill="#374151">Past this point AI can still change the system,</text>
  <text x="420" y="226" text-anchor="middle" font-size="18" fill="#374151">but no human can tell whether the change is correct.</text>
</svg>
