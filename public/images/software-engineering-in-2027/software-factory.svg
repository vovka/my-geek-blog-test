<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">An AI software factory: the SDLC as a pipeline of agents</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
  <g font-size="18" text-anchor="middle" fill="#1e3a8a">
    <rect x="40" y="220" width="150" height="90" rx="12" fill="#e5e7eb"/><text x="115" y="258" fill="#111827">Requirement</text><text x="115" y="284" fill="#111827">enters</text>
    <rect x="230" y="220" width="150" height="90" rx="12" fill="#dbeafe"/><text x="305" y="258">Agents analyse</text><text x="305" y="284">architecture</text>
    <rect x="420" y="220" width="150" height="90" rx="12" fill="#dbeafe"/><text x="495" y="258">Plan is</text><text x="495" y="284">created</text>
    <rect x="610" y="220" width="150" height="90" rx="12" fill="#dbeafe"/><text x="685" y="258">Coding agents</text><text x="685" y="284">isolated changes</text>
    <rect x="800" y="220" width="150" height="90" rx="12" fill="#dbeafe"/><text x="875" y="258">Review agents</text><text x="875" y="284">+ tests</text>
    <rect x="990" y="220" width="170" height="90" rx="12" fill="#111827"/><text x="1075" y="258" fill="#ffffff">Production</text><text x="1075" y="284" fill="#ffffff">change lands</text>
  </g>
  <g stroke="#374151" stroke-width="3" marker-end="url(#a)">
    <line x1="190" y1="265" x2="226" y2="265"/><line x1="380" y1="265" x2="416" y2="265"/><line x1="570" y1="265" x2="606" y2="265"/>
    <line x1="760" y1="265" x2="796" y2="265"/><line x1="950" y1="265" x2="986" y2="265"/>
  </g>
  <!-- failure loop -->
  <path d="M875,310 L875,380 L495,380 L495,314" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="685" y="405" text-anchor="middle" font-size="18" fill="#dc2626">Failures return work to an earlier stage</text>
  <!-- humans -->
  <g font-size="18" text-anchor="middle" fill="#78350f">
    <rect x="330" y="110" width="540" height="60" rx="12" fill="#fef3c7"/>
    <text x="600" y="147">Humans intervene only where judgment is still required</text>
  </g>
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 5"><line x1="495" y1="170" x2="495" y2="216"/><line x1="875" y1="170" x2="875" y2="216"/></g>
  <text x="600" y="490" text-anchor="middle" font-size="22" fill="#374151">The competition is no longer engineer vs. engineer.</text>
  <text x="600" y="525" text-anchor="middle" font-size="22" fill="#374151">It is between how well each company's system turns an idea into reliable software.</text>
</svg>
