<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="600" y="60" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Two reactions to AI in 2026, two very different 2027s</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect x="450" y="100" width="300" height="70" rx="14" fill="#111827"/>
  <text x="600" y="143" text-anchor="middle" font-size="22" fill="#ffffff">"AI can write the code"</text>
  <line x1="520" y1="170" x2="300" y2="230" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <line x1="680" y1="170" x2="900" y2="230" stroke="#374151" stroke-width="3" marker-end="url(#a)"/>
  <!-- left -->
  <g text-anchor="middle">
    <rect x="80" y="240" width="440" height="330" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="300" y="285" font-size="24" font-weight="700" fill="#991b1b">Group 1: replace engineers</text>
    <text x="300" y="325" font-size="19" fill="#7f1d1d">Founder, marketer or PM asks an agent</text>
    <text x="300" y="352" font-size="19" fill="#7f1d1d">to build the app. Fewer developers.</text>
    <text x="300" y="400" font-size="19" fill="#7f1d1d">Works, feature after feature...</text>
    <text x="300" y="440" font-size="21" font-weight="700" fill="#991b1b">until the complexity ceiling</text>
    <text x="300" y="480" font-size="19" fill="#7f1d1d">AI can still change the system.</text>
    <text x="300" y="507" font-size="19" fill="#7f1d1d">Nobody can check whether the change is right.</text>
    <text x="300" y="548" font-size="19" font-weight="700" fill="#991b1b">2027: AI-generated slop needs cleanup</text>
  </g>
  <!-- right -->
  <g text-anchor="middle">
    <rect x="680" y="240" width="440" height="330" rx="16" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="900" y="285" font-size="24" font-weight="700" fill="#065f46">Group 2: keep engineers, automate the SDLC</text>
    <text x="900" y="325" font-size="19" fill="#064e3b">Engineers stay. The process around them</text>
    <text x="900" y="352" font-size="19" fill="#064e3b">is turned into an agent pipeline.</text>
    <text x="900" y="400" font-size="19" fill="#064e3b">Requirement in, reviewed and tested</text>
    <text x="900" y="427" font-size="19" fill="#064e3b">change out. Humans judge, agents do.</text>
    <text x="900" y="475" font-size="21" font-weight="700" fill="#065f46">A factory producing software</text>
    <text x="900" y="548" font-size="19" font-weight="700" fill="#065f46">2027: competition moves to the factory level</text>
  </g>
</svg>
