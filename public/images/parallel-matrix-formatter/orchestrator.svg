<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">
  <rect width="720" height="390" fill="#fff"/>
  <style>
    .box{fill:#fff;stroke:#555;stroke-width:1.5;rx:6}
    .t{fill:#222;text-anchor:middle}
    .s{fill:#666;text-anchor:middle;font-size:13}
    .l{stroke:#555;stroke-width:1.5;fill:none}
  </style>
  <rect class="box" x="30"  y="30" width="180" height="60"/>
  <rect class="box" x="270" y="30" width="180" height="60"/>
  <rect class="box" x="510" y="30" width="180" height="60"/>
  <text class="t" x="120" y="55">Process 1</text><text class="s" x="120" y="76">RSpec</text>
  <text class="t" x="360" y="55">Process 2</text><text class="s" x="360" y="76">RSpec</text>
  <text class="t" x="600" y="55">Process 3</text><text class="s" x="600" y="76">RSpec</text>

  <path class="l" d="M120,90 V140 H600 V90"/>
  <path class="l" d="M360,90 V162"/>
  <polygon points="354,160 366,160 360,170" fill="#555"/>
  <text class="s" x="440" y="128" text-anchor="start">UNIX socket</text>

  <rect class="box" x="255" y="170" width="210" height="60"/>
  <text class="t" x="360" y="195">Orchestrator</text><text class="s" x="360" y="216">inside process 1</text>

  <path class="l" d="M360,230 V292"/>
  <polygon points="354,290 366,290 360,300" fill="#555"/>
  <text class="s" x="372" y="266" text-anchor="start">results, summaries</text>

  <rect class="box" x="255" y="300" width="210" height="60"/>
  <text class="t" x="360" y="325">One terminal</text><text class="s" x="360" y="346">progress + final report</text>
</svg>
